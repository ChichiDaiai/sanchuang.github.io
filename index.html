    // 历史记录栈（用于返回上一级）
    let historyStack = [];

    // 打开模态框函数（修复版）
    function openModal(title, contentHtml, pushToHistory = true, clearHistory = false) {
        // 如果是全新的打开（比如点击导航栏），清空历史栈
        if (clearHistory) {
            historyStack = [];
        }
        
        if (pushToHistory && modalOverlay.classList.contains('active')) {
            // 只有当模态框已打开时才保存当前状态到历史栈
            historyStack.push({
                title: modalTitle.textContent,
                content: modalContent.innerHTML
            });
        }
        
        modalTitle.textContent = title;
        modalContent.innerHTML = contentHtml;
        modalOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        // 每次打开新内容后，重新绑定事件
        bindCardEvents();
        bindFunctionItemEvents();
    }

    // 绑定两个大卡片的事件

            // 移除原有事件避免重复绑定

                e.stopPropagation();
                const title = this.getAttribute('data-title');
                const detail = this.getAttribute('data-detail');
                if (detail) {
                    const formattedDetail = textToParagraphs(detail);
                    openModal(title, formattedDetail);
                }
            });
        });
    }

    // 返回上一级
    function goBack() {
        if (historyStack.length > 0) {
            const previous = historyStack.pop();
            modalTitle.textContent = previous.title;
            modalContent.innerHTML = previous.content;
            // 返回后重新绑定事件
            bindCardEvents();
            bindFunctionItemEvents();
        } else {
            // 没有历史记录了，关闭模态框
            closeModal();
        }
    }

    // 关闭模态框（清空历史）
    function closeModal() {
        modalOverlay.classList.remove('active');
        document.body.style.overflow = '';
        historyStack = [];  // 清空历史记录
    }

    // 将纯文本转换为段落HTML
    function textToParagraphs(text) {
        const paragraphs = text.split(/\n\s*\n/);
        if (paragraphs.length === 1) {
            return `<p>${text}</p>`;
        }
        return paragraphs.map(para => `<p>${para.trim()}</p>`).join('');
    }

    // 生成两个大卡片的HTML
    function generateCardsHTML() {
        return `
            <div class="cards-container" style="display: flex; flex-direction: column; gap: 24px;">
                <div class="big-card" id="landCard" style="background-color: rgba(255, 255, 255, 0.92); border-radius: 16px; padding: 20px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25); cursor: pointer; transition: transform 0.3s ease; text-align: center;">
                    <h3 style="color: #2c7d38; font-size: 28px; margin: 0;">土地托管服务</h3>
                    <p style="color: #444; margin: 16px 0 0 0;"></p>
                </div>
                <div class="big-card" id="platformCard" style="background-color: rgba(255, 255, 255, 0.92); border-radius: 16px; padding: 20px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25); cursor: pointer; transition: transform 0.3s ease; text-align: center;">
                    <h3 style="color: #2c7d38; font-size: 28px; margin: 0;">平台驱动种植服务</h3>
                    <p style="color: #444; margin: 16px 0 0 0;"></p>
                </div>
            </div>
        `;
    }

    // 生成功能列表HTML（用于右侧大卡片）
    function generateFunctionsList() {
        let html = '<div class="function-list" style="display: flex; flex-direction: column; gap: 16px;">';
        functionsData.forEach(func => {
            html += `
                <div class="function-item" data-title="${func.title}" data-detail="${func.detail.replace(/"/g, '&quot;')}" style="background-color: #f8fdf4; border-left: 4px solid #2c7d38; border-radius: 10px; padding: 16px 20px; cursor: pointer; transition: all 0.2s ease;">
                    <h4 style="color: #2c7d38; font-size: 20px; margin: 0 0 8px 0;">${func.title}</h4>
                    <p style="color: #555; font-size: 14px; margin: 0;"></p>
                </div>
            `;
        });
        html += '</div>';
        return html;
    }

    // 显示技术与服务（两个大卡片）- 清空历史
    function showTechService() {
        const cardsHTML = generateCardsHTML();
        openModal('技术与服务', cardsHTML, false, true);  // 不清空历史
    }
    
    // 导航栏点击事件
    document.getElementById('nav-home').addEventListener('click', () => alert('首页功能开发中，敬请期待！'));
    
    // 关于Planter - 显示公司简介（清空历史）
    document.getElementById('nav-aboutPlanter').addEventListener('click', function() {
        const formattedIntro = textToParagraphs(companyIntro);
        openModal('关于 Planter', formattedIntro, true, true);
    });
    
    document.getElementById('nav-join').addEventListener('click', () => alert('加入我们功能开发中，敬请期待！'));
    document.getElementById('nav-contact').addEventListener('click', () => alert('联系我们功能开发中，敬请期待！'));
    document.getElementById('nav-register').addEventListener('click', () => alert('免费注册功能开发中，敬请期待！'));
    document.getElementById('nav-mobile').addEventListener('click', () => alert('手机版功能开发中，敬请期待！'));

    // 关闭按钮事件 - 返回上一级或关闭
    closeModalBtn.addEventListener('click', function() {
        if (historyStack.length > 0) {
            goBack();
        } else {
            closeModal();
        }
    });
    
    // 点击遮罩层 - 返回上一级或关闭
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
            if (historyStack.length > 0) {
                goBack();
            } else {
                closeModal();
            }
        }
    });
    
    // ESC键 - 返回上一级或关闭
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
            if (historyStack.length > 0) {
                goBack();
            } else {
                closeModal();
            }
        }
    });
    </script>
</body>
</html>
